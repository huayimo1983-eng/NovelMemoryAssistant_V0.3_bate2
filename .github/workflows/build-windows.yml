name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NovelMemoryAssistant_V0_3_BETA --paths . --collect-submodules app app/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovelMemoryAssistant_V0_3_BETA_Windows_EXE
          path: dist/NovelMemoryAssistant_V0_3_BETA.exe
